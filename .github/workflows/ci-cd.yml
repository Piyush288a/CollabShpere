name: CollabSphere CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - PD-FutureDevelopment
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # Job 1: Backend Automated Test Suite
  # ----------------------------------------------------
  test-backend:
    name: Backend Tests (Jest & MongoDB)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 5001
          MONGODB_URI: mongodb://localhost:27017/collabsphere_test
          MONGODB_TEST_URI: mongodb://localhost:27017/collabsphere_test
          JWT_SECRET: test_jwt_secret_key_ci_cd_environment_123
          JWT_EXPIRES_IN: 7d
        run: npm test

  # ----------------------------------------------------
  # Job 2: Frontend Production Build Verification
  # ----------------------------------------------------
  build-frontend:
    name: Frontend Build Verification (Vite & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: ./frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_API_BASE_URL: 'https://collabsphere-backend.onrender.com/api'
          VITE_SOCKET_URL: 'https://collabsphere-backend.onrender.com'
        run: npm run build

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ----------------------------------------------------
  # Job 3: Automated Production Deployment (Render + Vercel)
  # ----------------------------------------------------
  deploy:
    name: Production Deployment
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Trigger Backend Deployment on Render via Webhook
      - name: Trigger Render Deploy Hook (Backend)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment webhook..."
          curl -s -S -X POST "${RENDER_DEPLOY_HOOK}"
          echo "Render deployment triggered successfully!"

      # 2. Deploy Frontend to Vercel
      - name: Deploy Frontend to Vercel
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend
